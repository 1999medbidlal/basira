<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800">
  <rect width="1200" height="800" fill="#fdfbf7"/>
  <rect x="40" y="40" width="1120" height="720" fill="none" stroke="#e2d9cc" stroke-width="2"/>
  
  <text x="100" y="140" font-family="'Outfit', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="42" font-weight="bold" fill="#1e293b">
    Chapitre 2 : L'Essentiel est Invisible
  </text>
  
  <text x="100" y="240" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" fill="#334155">
    Basira est un assistant visuel qui preserve la photographie originale du livre.
  </text>
  
  <text x="100" y="320" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" fill="#334155">
